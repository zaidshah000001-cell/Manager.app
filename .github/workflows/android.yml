name: Manager Gemini Android Build
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify preinstalled Android SDK
        run: test -d "$ANDROID_HOME"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'
      - name: Compile Gemini app
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: manager-gemini-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
